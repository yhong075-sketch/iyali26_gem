name: evidence-pipeline-tests

# Rule core of the evidence pipeline: deterministic, no LLM, no research workspace, no model file.
# The full platform suite has failures that predate this job, so only the evidence tests gate merges.
# memote keeps its own workflows.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "pydantic>=2.12,<3" "pyyaml>=6" "pytest>=8"
      - name: Run evidence tests
        run: python -m pytest tests/test_evidence_rules.py tests/test_evidence_pipeline.py tests/test_evidence_eco.py -q
