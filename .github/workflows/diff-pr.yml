name: memote-diff

# Memote diff of the PR's model (memote.ini `model`) against the same file on main. The report is
# attached to the run as an artifact; nothing is published (the repository has no gh-pages branch or
# Pages site). Versions match memote.yml.

on:
  pull_request:
    branches:
      - main

jobs:
  diff:
    runs-on: ubuntu-latest
    # A crashed memote worker otherwise hangs the job until GitHub's 6-hour limit.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install memote==0.14.0 'depinfo<2' 'numpy<2'
    - name: Memote diff against main
      run: |
        # Only the `model = ...` line (other keys, such as `experimental`, also contain "model").
        model=$(awk -F '=' '$1 ~ /^[[:space:]]*model[[:space:]]*$/ {gsub(/[[:space:]]/, "", $2); print $2}' memote.ini)
        test -n "$model" && test -f "$model"
        previous="${RUNNER_TEMP}/main_model.xml"
        git show "origin/main:${model}" > "$previous"
        mkdir -p memote-diff
        # memote tests the two models in parallel workers; GLPK aborted one worker in this MILP test
        # (run 41006117293) and the pool then waited forever. Both models skip it, so the diff stays fair.
        memote report diff --skip test_inconsistent_min_stoichiometry \
          --filename "memote-diff/diff_${GITHUB_SHA}.html" "$model" "$previous"
    - name: Upload diff report
      uses: actions/upload-artifact@v4
      with:
        name: memote-diff-${{ github.sha }}
        path: memote-diff/
        if-no-files-found: error
